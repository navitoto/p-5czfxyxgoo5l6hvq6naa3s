<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2b1a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="המגדל">
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<title>המגדל</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#2b1a12; touch-action:none; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    font-family:-apple-system,"Segoe UI",Arial,sans-serif; }
  canvas { display:block; width:100vw; height:100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var W = 360, H = 640, scale = 1;

  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
    H = Math.round(W * vh / vw); scale = canvas.width / W;
  }
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 100); });
  resize();

  // ---------- Texts (Hebrew, pending Tut's approval) ----------
  var T = {
    title: "יום הולדת שמח, אוראל!",
    sub: "החזיקי את הצד הימני או השמאלי של המסך כדי לזוז. הקפיצה אוטומטית - ככל שתזוזי מהר יותר, תקפצי גבוה יותר!",
    tap: "געי במסך כדי להתחיל",
    best: "השיא שלך: ",
    over: "אוף, נרדמת!",
    floors: "קומות: ",
    items: "אספת: ",
    newBest: "שיא חדש!",
    again: "געי במסך כדי לנסות שוב",
    combo: "קומבו +",
    dog: "ליאו: הב הב!"
  };

  // ---------- Stages ----------
  var STAGE_FLOORS = 25;
  var STAGES = [
    { name: "תה קר עם פנינים", top: "#f6d7a7", bot: "#e9a35e", plat: "tea", item: "pearl", label: "פנינים" },
    { name: "שוקו חם", top: "#5a3524", bot: "#2f1a11", plat: "choco", item: "marsh", label: "מרשמלו" },
    { name: "הכלב", top: "#9bd8ff", bot: "#bfe8a4", plat: "bone", item: "bone", label: "עצמות" },
    { name: "צ'יפס", top: "#ffd34d", bot: "#f06a3a", plat: "fry", item: "fry", label: "צ'יפסים" },
    { name: "שקיות מהסופר", top: "#bfe3f5", bot: "#e7f4fa", plat: "bag", item: "bag", label: "שקיות" }
  ];

  // ---------- Images ----------
  var imgs = {};
  function load(name, src) { var im = new Image(); im.src = src; imgs[name] = im; }
  var FACE_COUNT = 11;
  for (var i = 1; i <= FACE_COUNT; i++) load("a" + i, "img/a" + i + ".webp");
  load("d1", "img/d1.webp"); load("d2", "img/d2.webp");
  function ready(n) { var im = imgs[n]; return im && im.complete && im.naturalWidth > 0; }
  // Expressions: happy while rising, surprised while falling, sleeping on game over
  var HAPPY = ["a4", "a6", "a9", "a8", "a10", "a5", "a11"];
  var FALL = ["a2", "a3", "a7"];
  var FACE_SLEEP = "a1", FACE_START = "a6";

  // ---------- State ----------
  var STATE_START = 0, STATE_PLAY = 1, STATE_OVER = 2;
  var state = STATE_START;
  var GRAVITY = 2400, MOVE_ACCEL = 2600, MAX_RUN = 300, FRICTION = 1800, BASE_JUMP = 700, SPEED_JUMP_BONUS = 1.35, WALL_KEEP = 0.85;
  var player, platforms, camY, highestY, startY, score, best, comboText, comboUntil, particles, itemsGot, popups, lastLandY, runStartedAt = 0;
  var bannerText = "", bannerUntil = 0, lastStage = -1, faceChangedAt = 0;
  best = parseInt(localStorage.getItem("orel_best") || "0", 10) || 0;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function nowS() { return performance.now() / 1000; }

  function floorsAt(y) { return Math.max(0, (startY - y) / 100); }
  function stageAt(y) { return Math.floor(floorsAt(y) / STAGE_FLOORS) % STAGES.length; }

  function makePlatform(y, forceWide) {
    var fl = floorsAt(y);
    var difficulty = Math.min(1, fl * 100 / 6000);
    var w = forceWide ? W : rand(110 - 45 * difficulty, 150 - 55 * difficulty);
    var x = forceWide ? 0 : rand(8, W - 8 - w);
    var p = { x: x, y: y, w: w, h: 12, stage: stageAt(y), dog: false, item: null };
    if (!forceWide && fl > 4 && Math.random() < 0.07) p.dog = true;
    else if (!forceWide && Math.random() < 0.35) p.item = { dx: rand(14, w - 14), got: false };
    return p;
  }

  function reset() {
    startY = 0; platforms = []; particles = []; popups = [];
    var ground = { x: 0, y: 0, w: W, h: 14, stage: 0, dog: false, item: null };
    platforms.push(ground);
    var y = 0, first = true;
    while (y > -H * 1.2 - 200) { y -= rand(75, 105); platforms.push(makePlatform(y, first)); first = false; }
    player = { x: W / 2, y: -20, vx: 0, vy: 0, r: 18, ground: ground, faceDir: 1, squash: 0, face: "a6" };
    camY = -H + 60; highestY = 0; score = 0; itemsGot = 0; lastLandY = 0;
    comboText = ""; comboUntil = 0; lastStage = -1; bannerUntil = 0;
  }

  function ensurePlatforms() {
    var top = platforms[platforms.length - 1];
    while (top.y > camY - 300) {
      var gap = rand(75, 110 + Math.min(30, (startY - top.y) / 400));
      top = makePlatform(top.y - gap, false); platforms.push(top);
    }
    while (platforms.length && platforms[0].y > camY + H + 300) platforms.shift();
  }

  // ---------- Input ----------
  var held = { left: 0, right: 0 }, keys = { left: false, right: false };
  function sideOf(x) { return x < window.innerWidth / 2 ? "left" : "right"; }
  canvas.addEventListener("pointerdown", function (e) { e.preventDefault(); if (state !== STATE_PLAY) { advance(); return; } held[sideOf(e.clientX)]++; });
  function onUp(e) { var s = sideOf(e.clientX); if (held[s] > 0) held[s]--; }
  window.addEventListener("pointerup", onUp); window.addEventListener("pointercancel", onUp);
  window.addEventListener("blur", function () { held.left = 0; held.right = 0; });
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
    if ((e.key === " " || e.key === "Enter") && state !== STATE_PLAY) advance();
  });
  window.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
  });
  var overAt = 0;
  function advance() {
    if (state === STATE_OVER && nowS() - overAt < 0.7) return; // avoid accidental instant restart
    reset(); state = STATE_PLAY; runStartedAt = 0; held.left = 0; held.right = 0;
  }

  // ---------- Simulation ----------
  function step(dt) {
    var mL = held.left > 0 || keys.left, mR = held.right > 0 || keys.right;
    if (mL && !mR) { player.vx = Math.max(player.vx - MOVE_ACCEL * dt, -MAX_RUN); player.faceDir = -1; }
    else if (mR && !mL) { player.vx = Math.min(player.vx + MOVE_ACCEL * dt, MAX_RUN); player.faceDir = 1; }
    else { var f = FRICTION * dt; if (Math.abs(player.vx) <= f) player.vx = 0; else player.vx -= Math.sign(player.vx) * f; }
    player.vy += GRAVITY * dt; player.x += player.vx * dt; player.y += player.vy * dt;
    if (player.x < player.r) { player.x = player.r; player.vx = Math.abs(player.vx) * WALL_KEEP; }
    if (player.x > W - player.r) { player.x = W - player.r; player.vx = -Math.abs(player.vx) * WALL_KEEP; }

    if (player.vy > 0) {
      for (var i = 0; i < platforms.length; i++) {
        var p = platforms[i];
        var prevBottom = player.y - player.vy * dt + player.r, bottom = player.y + player.r;
        if (prevBottom <= p.y + 4 && bottom >= p.y && player.x > p.x - player.r * 0.5 && player.x < p.x + p.w + player.r * 0.5) { land(p); break; }
      }
    }
    // collect items
    for (var k = 0; k < platforms.length; k++) {
      var q = platforms[k];
      if (q.item && !q.item.got) {
        var ix = q.x + q.item.dx, iy = q.y - 18;
        if (Math.abs(player.x - ix) < player.r + 8 && Math.abs(player.y - iy) < player.r + 8) {
          q.item.got = true; itemsGot++;
          popups.push({ x: ix, y: iy, t: 0.8, txt: "+1" });
          for (var s = 0; s < 6; s++) particles.push({ x: ix, y: iy, vx: rand(-90, 90), vy: rand(-140, -20), life: rand(0.2, 0.5), max: 0.5, c: "255,230,120" });
        }
      }
    }
    if (player.squash > 0) player.squash = Math.max(0, player.squash - dt * 6);
    var target = player.y - H * 0.42;
    if (target < camY) camY += (target - camY) * Math.min(1, dt * 8);
    if (player.y < highestY) { highestY = player.y; score = Math.max(score, Math.floor((startY - highestY) / 100)); }
    ensurePlatforms();
    for (var j = particles.length - 1; j >= 0; j--) {
      var pt = particles[j]; pt.life -= dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 900 * dt;
      if (pt.life <= 0) particles.splice(j, 1);
    }
    for (var m = popups.length - 1; m >= 0; m--) { popups[m].t -= dt; popups[m].y -= 40 * dt; if (popups[m].t <= 0) popups.splice(m, 1); }

    var st = stageAt(highestY);
    if (st !== lastStage) {
      if (lastStage !== -1 || score > 0) { bannerText = STAGES[st].name; bannerUntil = nowS() + 2.2; }
      lastStage = st;
    }
    if (player.y - camY > H + 40) { state = STATE_OVER; overAt = nowS(); if (score > best) { best = score; localStorage.setItem("orel_best", String(best)); } }
    // face: happy going up, surprised when falling
    if (player.vy > 650) { if (FALL.indexOf(player.face) < 0) { player.face = pick(FALL); faceChangedAt = nowS(); } }
  }

  function land(p) {
    var gained = Math.max(0, Math.round((lastLandY - p.y) / 100));
    lastLandY = p.y; player.y = p.y - player.r;
    var boost = Math.min(Math.abs(player.vx), MAX_RUN) * SPEED_JUMP_BONUS;
    player.vy = -(BASE_JUMP + boost);
    if (p.dog) { player.vy = -(BASE_JUMP * 1.75 + boost * 0.3); popups.push({ x: p.x + p.w / 2, y: p.y - 60, t: 1.1, txt: T.dog }); }
    player.squash = 1; if (nowS() - faceChangedAt > 3 || FALL.indexOf(player.face) >= 0) { var nf; do { nf = pick(HAPPY); } while (nf === player.face && HAPPY.length > 1); player.face = nf; faceChangedAt = nowS(); }
    for (var i = 0; i < 6; i++) particles.push({ x: player.x + rand(-8, 8), y: p.y, vx: rand(-120, 120), vy: rand(-160, -20), life: rand(0.2, 0.45), max: 0.45, c: "255,255,255" });
    if (gained >= 2) { comboText = T.combo + gained + "!"; comboUntil = nowS() + 1.2; }
  }

  // ---------- Drawing helpers ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }

  // themed items: draw centered at (x,y), s = size
  function drawThing(type, x, y, s) {
    ctx.save(); ctx.translate(x, y);
    if (type === "pearl") {
      circle(0, 0, s * 0.5, "#3b2418"); circle(-s * 0.15, -s * 0.15, s * 0.14, "rgba(255,255,255,0.55)");
    } else if (type === "cup") { // iced tea cup with straw
      ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.beginPath(); ctx.moveTo(-s * 0.4, -s * 0.5); ctx.lineTo(s * 0.4, -s * 0.5); ctx.lineTo(s * 0.3, s * 0.5); ctx.lineTo(-s * 0.3, s * 0.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#c97a3a"; ctx.beginPath(); ctx.moveTo(-s * 0.36, -s * 0.2); ctx.lineTo(s * 0.36, -s * 0.2); ctx.lineTo(s * 0.3, s * 0.5); ctx.lineTo(-s * 0.3, s * 0.5); ctx.closePath(); ctx.fill();
      for (var i = 0; i < 6; i++) circle(-s * 0.2 + (i % 3) * s * 0.2, s * 0.38 - Math.floor(i / 3) * s * 0.12, s * 0.07, "#2b170e");
      ctx.fillStyle = "#e84a6f"; ctx.fillRect(s * 0.05, -s * 0.9, s * 0.07, s * 0.8);
    } else if (type === "marsh") {
      ctx.fillStyle = "#fff6ee"; rr(-s * 0.4, -s * 0.4, s * 0.8, s * 0.8, s * 0.25); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,0.08)"; rr(-s * 0.4, s * 0.15, s * 0.8, s * 0.25, s * 0.2); ctx.fill();
    } else if (type === "mug") {
      ctx.fillStyle = "#e9d8c6"; rr(-s * 0.4, -s * 0.35, s * 0.7, s * 0.8, s * 0.12); ctx.fill();
      ctx.strokeStyle = "#e9d8c6"; ctx.lineWidth = s * 0.1; ctx.beginPath(); ctx.arc(s * 0.32, s * 0.05, s * 0.2, -1.4, 1.4); ctx.stroke();
      ctx.fillStyle = "#5a2e1b"; ctx.fillRect(-s * 0.34, -s * 0.3, s * 0.58, s * 0.1);
      ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = s * 0.05; ctx.beginPath();
      ctx.moveTo(-s * 0.1, -s * 0.5); ctx.bezierCurveTo(-s * 0.25, -s * 0.7, s * 0.05, -s * 0.8, -s * 0.1, -s * 1.0);
      ctx.moveTo(s * 0.1, -s * 0.5); ctx.bezierCurveTo(s * 0.0, -s * 0.7, s * 0.25, -s * 0.8, s * 0.1, -s * 1.0); ctx.stroke();
    } else if (type === "bone") {
      ctx.fillStyle = "#fff8ea"; ctx.fillRect(-s * 0.35, -s * 0.12, s * 0.7, s * 0.24);
      circle(-s * 0.38, -s * 0.14, s * 0.15, "#fff8ea"); circle(-s * 0.38, s * 0.14, s * 0.15, "#fff8ea");
      circle(s * 0.38, -s * 0.14, s * 0.15, "#fff8ea"); circle(s * 0.38, s * 0.14, s * 0.15, "#fff8ea");
    } else if (type === "paw") {
      circle(0, s * 0.15, s * 0.22, "rgba(110,70,40,0.35)");
      circle(-s * 0.25, -s * 0.12, s * 0.1, "rgba(110,70,40,0.35)"); circle(-s * 0.08, -s * 0.28, s * 0.1, "rgba(110,70,40,0.35)");
      circle(s * 0.12, -s * 0.28, s * 0.1, "rgba(110,70,40,0.35)"); circle(s * 0.29, -s * 0.12, s * 0.1, "rgba(110,70,40,0.35)");
    } else if (type === "fry") {
      ctx.fillStyle = "#ffd02e"; rr(-s * 0.1, -s * 0.5, s * 0.2, s * 1.0, s * 0.05); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillRect(-s * 0.06, -s * 0.46, s * 0.04, s * 0.9);
    } else if (type === "carton") {
      ctx.fillStyle = "#ffd02e";
      for (var f = -2; f <= 2; f++) { ctx.save(); ctx.rotate(f * 0.12); rr(f * s * 0.14 - s * 0.05, -s * 0.9, s * 0.1, s * 0.9, 3); ctx.fill(); ctx.restore(); }
      ctx.fillStyle = "#d7262b"; ctx.beginPath(); ctx.moveTo(-s * 0.4, -s * 0.2); ctx.lineTo(s * 0.4, -s * 0.2); ctx.lineTo(s * 0.3, s * 0.5); ctx.lineTo(-s * 0.3, s * 0.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#ffe46b"; ctx.font = "bold " + (s * 0.3) + "px Arial"; ctx.textAlign = "center"; ctx.fillText("M", 0, s * 0.3);
    } else if (type === "bag") {
      ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.beginPath(); ctx.moveTo(-s * 0.35, -s * 0.2); ctx.lineTo(s * 0.35, -s * 0.2); ctx.lineTo(s * 0.42, s * 0.5); ctx.lineTo(-s * 0.42, s * 0.5); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = s * 0.06;
      ctx.beginPath(); ctx.arc(-s * 0.18, -s * 0.2, s * 0.17, Math.PI, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(s * 0.18, -s * 0.2, s * 0.17, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = "#e84a6f"; ctx.fillRect(-s * 0.3, s * 0.05, s * 0.6, s * 0.12);
      ctx.fillStyle = "rgba(0,0,0,0.08)"; ctx.fillRect(-s * 0.42, s * 0.4, s * 0.84, s * 0.1);
    }
    ctx.restore();
  }

  var DECOR = [
    ["cup", "pearl", "pearl", "cup", "pearl", "pearl", "pearl", "cup"],
    ["mug", "marsh", "marsh", "mug", "marsh", "marsh", "marsh", "mug"],
    ["bone", "paw", "paw", "bone", "paw", "bone", "paw", "paw"],
    ["carton", "fry", "fry", "carton", "fry", "fry", "fry", "carton"],
    ["bag", "bag", "bag", "bag", "bag", "bag", "bag", "bag"]
  ];

  function drawStageBG(si, alpha) {
    var S = STAGES[si];
    ctx.globalAlpha = alpha;
    var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, S.top); g.addColorStop(1, S.bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var list = DECOR[si], n = 14, scroll = -camY * 0.3, span = H + 120;
    for (var k = 0; k < n; k++) {
      var type = list[k % list.length];
      var x = (k * 97 + si * 41) % (W - 20) + 10;
      var y = ((k * span / n + scroll * (0.6 + (k % 3) * 0.3)) % span) - 60;
      var sz = (type === "cup" || type === "mug" || type === "carton" || type === "bag") ? 54 + (k % 3) * 14 : 22 + (k % 3) * 8;
      ctx.globalAlpha = alpha * (type === "cup" || type === "mug" || type === "carton" || type === "bag" ? 0.45 : 0.28);
      drawThing(type, x, y, sz);
    }
    if (si === 2) { // dog stage: the dog walks past in the background
      ctx.globalAlpha = alpha * 0.95;
      if (ready("d1")) { var d = imgs.d1, dh = 120, dw = d.naturalWidth * dh / d.naturalHeight; ctx.drawImage(d, W - dw - 6, H - dh - 40 + Math.sin(nowS() * 2) * 3, dw, dh); }
    }
    ctx.globalAlpha = 1;
  }

  function drawPlatform(p) {
    var S = STAGES[p.stage], t = S.plat;
    if (p.dog) { // dog on a bone-colored pad
      ctx.fillStyle = "#fff3da"; rr(p.x, p.y, p.w, p.h, 6); ctx.fill();
    } else if (t === "tea") {
      ctx.fillStyle = "rgba(150,220,245,0.95)"; rr(p.x, p.y, p.w, p.h, 5); ctx.fill();
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5; rr(p.x, p.y, p.w, p.h, 5); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.fillRect(p.x + 6, p.y + 2, p.w * 0.3, 2);
    } else if (t === "choco") {
      ctx.fillStyle = "#7a4a30"; rr(p.x, p.y, p.w, p.h, 3); ctx.fill();
      ctx.strokeStyle = "#4a2a1a"; ctx.lineWidth = 1;
      for (var x = p.x + 18; x < p.x + p.w - 4; x += 18) { ctx.beginPath(); ctx.moveTo(x, p.y); ctx.lineTo(x, p.y + p.h); ctx.stroke(); }
      ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fillRect(p.x + 2, p.y + 1, p.w - 4, 2);
    } else if (t === "bone") {
      ctx.fillStyle = "#fff3da"; rr(p.x + 6, p.y + 1, p.w - 12, p.h - 2, 4); ctx.fill();
      circle(p.x + 6, p.y + 2, 6, "#fff3da"); circle(p.x + 6, p.y + p.h - 2, 6, "#fff3da");
      circle(p.x + p.w - 6, p.y + 2, 6, "#fff3da"); circle(p.x + p.w - 6, p.y + p.h - 2, 6, "#fff3da");
      ctx.fillStyle = "rgba(0,0,0,0.12)"; ctx.fillRect(p.x + 8, p.y + p.h - 4, p.w - 16, 3);
    } else if (t === "fry") {
      ctx.fillStyle = "#ffcf2a"; rr(p.x, p.y, p.w, p.h, 3); ctx.fill();
      ctx.fillStyle = "#e0a912"; ctx.fillRect(p.x, p.y + p.h - 4, p.w, 4);
      ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.fillRect(p.x + 3, p.y + 2, p.w - 6, 2);
      ctx.fillStyle = "#fff"; for (var s = p.x + 12; s < p.x + p.w - 6; s += 22) ctx.fillRect(s, p.y + 5, 2, 2);
    } else {
      ctx.fillStyle = "#f4f7ff"; rr(p.x, p.y, p.w, p.h, 6); ctx.fill();
      ctx.fillStyle = "#e84a6f"; ctx.fillRect(p.x + 8, p.y + 3, p.w - 16, 3);
      ctx.fillStyle = "rgba(0,0,0,0.12)"; rr(p.x, p.y + p.h - 4, p.w, 4, 2); ctx.fill();
    }
    if (p.dog && ready("d2")) { var d = imgs.d2, dh = 52, dw = d.naturalWidth * dh / d.naturalHeight; ctx.drawImage(d, p.x + p.w / 2 - dw / 2, p.y - dh + 3, dw, dh); }
    if (p.item && !p.item.got) { var gx = p.x + p.item.dx, gy = p.y - 18; ctx.fillStyle = "rgba(255,240,150,0.55)"; ctx.beginPath(); ctx.arc(gx, gy, 14, 0, 6.2832); ctx.fill(); drawThing(STAGES[p.stage].item === "fry" ? "fry" : STAGES[p.stage].item, p.x + p.item.dx, p.y - 18 + Math.sin(nowS() * 4 + p.x) * 2, 20); }
  }

  function drawFace(x, y, size, name, tilt) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt || 0);
    if (ready(name)) ctx.drawImage(imgs[name], -size / 2, -size / 2, size, size);
    else circle(0, 0, size * 0.4, "#ffb98a");
    ctx.restore();
  }

  // Icy Tower style "homeboy": knit beanie, baggy hoodie, big sneakers; head = Orel's photo.
  function beanie(x, y, w) { // drawn on top of the head, centered at x, top of head at y
    ctx.fillStyle = "#e0453a"; ctx.beginPath(); ctx.ellipse(x, y + 2, w * 0.5, w * 0.42, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#fff"; for (var i = -1; i <= 1; i++) { ctx.fillRect(x + i * w * 0.2 - 1.5, y - w * 0.36, 3, w * 0.34); }
    ctx.fillStyle = "#b8281f"; rr(x - w * 0.52, y + 1, w * 1.04, w * 0.2, 4); ctx.fill();
    circle(x, y - w * 0.43, w * 0.12, "#fff");
  }
  function drawHarold(name, mode, vx, tVal) {
    // origin = player center, feet at +16. mode: 0 idle/run, 1 rising, 2 falling, 3 asleep (start/over uses big face instead)
    var run = Math.min(1, Math.abs(vx) / MAX_RUN), ph = tVal * 14;
    var legSwing = mode === 0 ? Math.sin(ph) * 5 * run : 0;
    ctx.save(); ctx.translate(0, 18); ctx.scale(1.3, 1.3); ctx.translate(0, -18); ctx.rotate(Math.max(-0.25, Math.min(0.25, vx / 1500)));
    var by = 2; // torso top
    var arms = mode === 1 ? -1 : (mode === 2 ? 0.2 : 0.6); // arms up when rising
    // legs (baggy jeans) + sneakers
    var lx = mode === 1 ? 3 : 4, ly = 8;
    ctx.fillStyle = "#3d5fa8";
    if (mode === 1) { rr(-8, ly, 6, 5, 2); ctx.fill(); rr(2, ly, 6, 5, 2); ctx.fill(); ctx.fillStyle = "#fff"; rr(-11, ly + 4, 9, 4, 2); ctx.fill(); rr(2, ly + 4, 9, 4, 2); ctx.fill(); }
    else { rr(-8 + legSwing, ly, 6, 8, 2); ctx.fill(); rr(2 - legSwing, ly, 6, 8, 2); ctx.fill(); ctx.fillStyle = "#fff"; rr(-11 + legSwing, ly + 6, 10, 4, 2); ctx.fill(); rr(1 - legSwing, ly + 6, 10, 4, 2); ctx.fill(); ctx.fillStyle = "#d7262b"; ctx.fillRect(-10 + legSwing, ly + 7.5, 8, 1.5); ctx.fillRect(2 - legSwing, ly + 7.5, 8, 1.5); }
    // arms
    ctx.strokeStyle = "#f2b43a"; ctx.lineCap = "round"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-9, by + 3); ctx.lineTo(-15, by + 3 + arms * -8 + (mode === 1 ? -6 : 6)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, by + 3); ctx.lineTo(15, by + 3 + arms * -8 + (mode === 1 ? -6 : 6)); ctx.stroke();
    // baggy hoodie
    ctx.fillStyle = "#f2b43a"; rr(-10, by, 20, 11, 4); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.12)"; ctx.fillRect(-10, by + 8, 20, 3);
    // head with Orel's face
    drawFace(0, -13, 36, name, 0);
    beanie(0, -29, 26);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    var hf = state === STATE_START ? 0 : floorsAt(highestY);
    var si = Math.floor(hf / STAGE_FLOORS) % STAGES.length, within = hf % STAGE_FLOORS;
    var t = within > STAGE_FLOORS - 2 ? (within - (STAGE_FLOORS - 2)) / 2 : 0;
    drawStageBG(si, 1);
    if (t > 0) drawStageBG((si + 1) % STAGES.length, t);

    ctx.save(); ctx.translate(0, -camY);
    for (var i = 0; i < platforms.length; i++) {
      var p = platforms[i];
      if (p.y - camY > H + 60 || p.y - camY < -80) continue;
      drawPlatform(p);
    }
    for (var j = 0; j < particles.length; j++) { var pt = particles[j]; ctx.fillStyle = "rgba(" + pt.c + "," + (0.8 * pt.life / pt.max) + ")"; ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4); }
    // player
    var sq = player.squash * 0.2;
    ctx.save(); ctx.translate(player.x, player.y);
    ctx.scale(1 + sq, 1 - sq);
    var fname = state === STATE_OVER ? FACE_SLEEP : (state === STATE_START ? FACE_START : player.face);
    ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.beginPath(); ctx.ellipse(0, player.r + 10, player.r * 0.9, 4, 0, 0, 6.2832); ctx.fill();
    drawHarold(fname, player.vy < -50 ? 1 : (player.vy > 500 ? 2 : 0), player.vx, nowS());
    ctx.restore();
    for (var m = 0; m < popups.length; m++) {
      ctx.globalAlpha = Math.min(1, popups[m].t * 2); ctx.fillStyle = "#fff"; ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 3;
      ctx.font = "bold 18px Arial"; ctx.textAlign = "center"; ctx.strokeText(popups[m].txt, popups[m].x, popups[m].y); ctx.fillText(popups[m].txt, popups[m].x, popups[m].y); ctx.globalAlpha = 1;
    }
    ctx.restore();
    drawHUD();
  }

  function outlined(txt, x, y, fill) {
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(40,20,10,0.65)"; ctx.lineJoin = "round"; ctx.strokeText(txt, x, y); ctx.fillStyle = fill || "#fff"; ctx.fillText(txt, x, y);
  }

  function drawHUD() {
    ctx.textAlign = "center";
    if (state === STATE_PLAY) {
      ctx.fillStyle = "rgba(0,0,0,0.4)"; rr(W / 2 - 46, 10, 92, 34, 10); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 22px Arial"; ctx.fillText(String(score), W / 2, 35);
      var S = STAGES[stageAt(highestY)];
      ctx.fillStyle = "rgba(0,0,0,0.4)"; rr(10, 10, 96, 28, 10); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 13px Arial"; ctx.textAlign = "center"; ctx.fillText(S.label + ": " + itemsGot, 58, 29);
      if (bannerUntil > nowS()) { ctx.globalAlpha = Math.min(1, (bannerUntil - nowS()) * 1.5); ctx.font = "bold 24px Arial"; outlined(bannerText, W / 2, H * 0.22, "#fff"); ctx.globalAlpha = 1; }
      if (comboText && nowS() < comboUntil) { ctx.font = "bold 20px Arial"; outlined(comboText, W / 2, H * 0.32, "#ffd54f"); }
      if (nowS() - runStartedAt < 5) {
        ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.font = "16px Arial";
        ctx.textAlign = "left"; ctx.fillText("◀ החזיקי", 14, H - 24); ctx.textAlign = "right"; ctx.fillText("החזיקי ▶", W - 14, H - 24); ctx.textAlign = "center";
      }
    } else if (state === STATE_START) {
      ctx.fillStyle = "rgba(30,15,8,0.55)"; ctx.fillRect(0, 0, W, H);
      ctx.font = "bold 30px Arial"; outlined(T.title, W / 2, H * 0.30, "#fff");
      ctx.font = "16px Arial"; ctx.fillStyle = "#ffe9cf"; wrap(T.sub, W / 2, H * 0.40, W - 70, 24);
      ctx.font = "bold 20px Arial"; outlined(T.tap, W / 2, H * 0.68, "#ffd54f");
      if (best > 0) { ctx.font = "15px Arial"; outlined(T.best + best, W / 2, H * 0.75, "#ffe9cf"); }
    } else {
      ctx.fillStyle = "rgba(30,15,8,0.6)"; ctx.fillRect(0, 0, W, H);
      if (ready(FACE_SLEEP)) { ctx.drawImage(imgs[FACE_SLEEP], W / 2 - 80, H * 0.12 + 18, 160, 160); ctx.save(); ctx.translate(W / 2, H * 0.12 + 36); ctx.scale(3.4, 3.4); beanie(0, 0, 26); ctx.restore(); }
      ctx.font = "bold 22px Arial"; outlined("z z z", W / 2 + 70, H * 0.14, "#cfe3ff");
      ctx.font = "bold 30px Arial"; outlined(T.over, W / 2, H * 0.43, "#fff");
      ctx.font = "20px Arial"; outlined(T.floors + score, W / 2, H * 0.50, "#ffe9cf");
      ctx.font = "16px Arial"; outlined(T.items + itemsGot + " " + STAGES[stageAt(highestY)].label, W / 2, H * 0.55, "#ffe9cf");
      ctx.font = "17px Arial"; var nb = score >= best && score > 0; outlined(nb ? T.newBest : T.best + best, W / 2, H * 0.61, nb ? "#ffd54f" : "#ffe9cf");
      ctx.font = "bold 20px Arial"; outlined(T.again, W / 2, H * 0.72, "#ffd54f");
    }
  }

  function wrap(text, cx, y, maxW, lh) {
    var words = text.split(" "), line = "";
    for (var n = 0; n < words.length; n++) {
      var test = line ? line + " " + words[n] : words[n];
      if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, cx, y); line = words[n]; y += lh; } else line = test;
    }
    if (line) ctx.fillText(line, cx, y);
  }

  var lastT = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    var now = t / 1000, dt = Math.min(0.033, now - (lastT || now)); lastT = now;
    if (state === STATE_PLAY) {
      if (!runStartedAt) runStartedAt = nowS();
      var rem = dt;
      while (rem > 0) { var h = Math.min(rem, 1 / 120); step(h); rem -= h; if (state !== STATE_PLAY) break; }
    }
    draw();
  }
  reset();
  requestAnimationFrame(loop);

  window.__game = {
    state: function () { return state; }, score: function () { return score; }, items: function () { return itemsGot; },
    start: advance, hold: function (s) { held[s]++; }, release: function (s) { if (held[s] > 0) held[s]--; },
    player: function () { return { x: player.x, y: player.y, vx: player.vx, vy: player.vy }; },
    over: function () { player.y = camY + H + 100; },
    teleportFloors: function (f) { var dy = -f * 100 - player.y; player.y += dy; camY += dy; highestY = player.y; score = f; lastLandY = startY - f * 100;
      var first=null; for (var i = 0; i < 12; i++) { var last = platforms[platforms.length - 1]; var np = makePlatform(Math.min(last.y, player.y) - 80, false); platforms.push(np); if(!first){first=np;} } if(first){first.dog=true;first.item=null;first.x=100;first.w=140;first.y=player.y-90;}
      platforms.push({ x: 0, y: player.y + 60, w: W, h: 12, stage: stageAt(player.y), dog: false, item: null }); }
  };
})();
</script>
</body>
