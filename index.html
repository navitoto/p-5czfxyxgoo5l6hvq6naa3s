    var r = w * 0.5, ch = w * 0.27;
    // dome
    ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, r * 0.96, w * 0.52, 0, Math.PI, 0); ctx.closePath(); ctx.clip();
    ctx.fillStyle = "#2f6fd6"; ctx.fillRect(x - r, y - w * 0.6, w, w * 0.62);
    ctx.fillStyle = "#6fa3ee"; ctx.fillRect(x - r, y - w * 0.16, w, w * 0.07); ctx.fillRect(x - r, y - w * 0.34, w, w * 0.07);
    ctx.strokeStyle = "rgba(20,50,120,0.28)"; ctx.lineWidth = 1;
    for (var k = -4; k <= 4; k++) { ctx.beginPath(); ctx.moveTo(x + k * w * 0.11, y); ctx.lineTo(x + k * w * 0.075, y - w * 0.55); ctx.stroke(); }
    ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.beginPath(); ctx.ellipse(x - r * 0.38, y - w * 0.3, w * 0.1, w * 0.17, -0.5, 0, 6.2832); ctx.fill();
    ctx.restore();
    // folded cuff with ribbing
    ctx.fillStyle = "#1f56b8"; rr(x - r * 1.04, y - 1, w * 1.04, ch, ch * 0.4); ctx.fill();
    ctx.strokeStyle = "rgba(10,35,95,0.45)"; ctx.lineWidth = 1;
    for (var m = -5; m <= 5; m++) { ctx.beginPath(); ctx.moveTo(x + m * w * 0.092, y + 1); ctx.lineTo(x + m * w * 0.092, y + ch - 2); ctx.stroke(); }
    ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fillRect(x - r * 0.95, y, w * 0.95, 1.5);
    // pom-pom
    var py = y - w * 0.56;
    circle(x, py, w * 0.15, "#e8f1ff");
    for (var q = 0; q < 6; q++) { var an = q * 1.05; circle(x + Math.cos(an) * w * 0.1, py + Math.sin(an) * w * 0.1, w * 0.07, "#cfe0ff"); }
    circle(x - w * 0.04, py - w * 0.04, w * 0.05, "#ffffff");
  }
  function drawHarold(name, mode, vx, tVal) {
    // origin = player center, feet at +16. mode: 0 idle/run, 1 rising, 2 falling, 3 asleep (start/over uses big face instead)
    var run = Math.min(1, Math.abs(vx) / MAX_RUN), ph = tVal * 14;
    var legSwing = mode === 0 ? Math.sin(ph) * 5 * run : 0;
    ctx.save(); ctx.translate(0, 18); ctx.scale(1.3, 1.3); ctx.translate(0, -18); ctx.rotate(Math.max(-0.25, Math.min(0.25, vx / 1500)));
    var by = 2; // torso top
    var arms = mode === 1 ? -1 : (mode === 2 ? 0.2 : 0.6); // arms up when rising
    // legs (baggy jeans) + sneakers
    var lx = mode === 1 ? 3 : 4, ly = 8;
    ctx.fillStyle = "#3d5fa8";
    if (mode === 1) { rr(-8, ly, 6, 5, 2); ctx.fill(); rr(2, ly, 6, 5, 2); ctx.fill(); ctx.fillStyle = "#fff"; rr(-11, ly + 4, 9, 4, 2); ctx.fill(); rr(2, ly + 4, 9, 4, 2); ctx.fill(); }
    else { rr(-8 + legSwing, ly, 6, 8, 2); ctx.fill(); rr(2 - legSwing, ly, 6, 8, 2); ctx.fill(); ctx.fillStyle = "#fff"; rr(-11 + legSwing, ly + 6, 10, 4, 2); ctx.fill(); rr(1 - legSwing, ly + 6, 10, 4, 2); ctx.fill(); ctx.fillStyle = "#d7262b"; ctx.fillRect(-10 + legSwing, ly + 7.5, 8, 1.5); ctx.fillRect(2 - legSwing, ly + 7.5, 8, 1.5); }
    // arms
    ctx.strokeStyle = "#f2b43a"; ctx.lineCap = "round"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(-9, by + 3); ctx.lineTo(-15, by + 3 + arms * -8 + (mode === 1 ? -6 : 6)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9, by + 3); ctx.lineTo(15, by + 3 + arms * -8 + (mode === 1 ? -6 : 6)); ctx.stroke();
    // baggy hoodie
    ctx.fillStyle = "#f2b43a"; rr(-10, by, 20, 11, 4); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.12)"; ctx.fillRect(-10, by + 8, 20, 3);
    // head with Orel's face
    drawFace(0, -13, 36, name, 0);
    beanie(0, -26, 31);
    ctx.restore();
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    var hf = state === STATE_START ? 0 : floorsAt(highestY);
    var si = Math.floor(hf / STAGE_FLOORS) % STAGES.length, within = hf % STAGE_FLOORS;
    var t = within > STAGE_FLOORS - 2 ? (within - (STAGE_FLOORS - 2)) / 2 : 0;
    drawStageBG(si, 1);
    if (t > 0) drawStageBG((si + 1) % STAGES.length, t);

    ctx.save(); ctx.translate(0, -camY);
    for (var i = 0; i < platforms.length; i++) {
      var p = platforms[i];
      if (p.y - camY > H + 60 || p.y - camY < -80) continue;
      drawPlatform(p);
    }
    for (var j = 0; j < particles.length; j++) { var pt = particles[j]; ctx.fillStyle = "rgba(" + pt.c + "," + (0.8 * pt.life / pt.max) + ")"; ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4); }
    // player
    var sq = player.squash * 0.2;
    ctx.save(); ctx.translate(player.x, player.y);
    ctx.scale(1 + sq, 1 - sq);
    var fname = state === STATE_OVER ? FACE_SLEEP : (state === STATE_START ? FACE_START : player.face);
    ctx.fillStyle = "rgba(0,0,0,0.18)"; ctx.beginPath(); ctx.ellipse(0, player.r + 10, player.r * 0.9, 4, 0, 0, 6.2832); ctx.fill();
    drawHarold(fname, player.vy < -50 ? 1 : (player.vy > 500 ? 2 : 0), player.vx, nowS());
    ctx.restore();
    for (var m = 0; m < popups.length; m++) {
      ctx.globalAlpha = Math.min(1, popups[m].t * 2); ctx.fillStyle = "#fff"; ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 3;
      ctx.font = "bold 18px Arial"; ctx.textAlign = "center"; ctx.strokeText(popups[m].txt, popups[m].x, popups[m].y); ctx.fillText(popups[m].txt, popups[m].x, popups[m].y); ctx.globalAlpha = 1;
    }
    ctx.restore();
    drawHUD();
    drawMute();
  }

  function outlined(txt, x, y, fill) {
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(40,20,10,0.65)"; ctx.lineJoin = "round"; ctx.strokeText(txt, x, y); ctx.fillStyle = fill || "#fff"; ctx.fillText(txt, x, y);
  }

  function drawMeter() {
    var x = W - 24, y0 = 96, h = 190, w = 14;
    ctx.fillStyle = "rgba(0,0,0,0.45)"; rr(x - 3, y0 - 3, w + 6, h + 6, 8); ctx.fill();
    var fh = h * meterShown;
    if (fh > 1) {
      var g = ctx.createLinearGradient(0, y0 + h, 0, y0); g.addColorStop(0, "#3ddc84"); g.addColorStop(0.55, "#ffd54f"); g.addColorStop(1, "#ff5a4f");
      ctx.fillStyle = g; rr(x, y0 + h - fh, w, fh, 5); ctx.fill();
    }
    ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 1;
    for (var i = 1; i < 4; i++) { var ty = y0 + h - h * i / 4; ctx.beginPath(); ctx.moveTo(x, ty); ctx.lineTo(x + w, ty); ctx.stroke(); }
    ctx.textAlign = "center"; ctx.font = "bold 11px Arial"; ctx.fillStyle = "#fff"; ctx.fillText(T.comboLbl, x + w / 2, y0 - 9);
    ctx.font = "bold 18px Arial"; outlined("x" + mult, x + w / 2, y0 + h + 24, mult > 1 ? "#ffd54f" : "#fff");
    if (breakFlash > 0) { ctx.globalAlpha = breakFlash * 0.6; ctx.fillStyle = "#ff5a4f"; rr(x - 3, y0 - 3, w + 6, h + 6, 8); ctx.fill(); ctx.globalAlpha = 1; }
  }
  function drawMute() {
    ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.beginPath(); ctx.arc(W - 26, 25, 15, 0, 6.2832); ctx.fill();
    ctx.font = "16px Arial"; ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.fillText(muted ? "🔇" : "🔊", W - 26, 31);
  }

  function drawHUD() {
    ctx.textAlign = "center";
    if (state === STATE_PLAY) {
      ctx.fillStyle = "rgba(0,0,0,0.4)"; rr(W / 2 - 46, 10, 92, 34, 10); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 22px Arial"; ctx.fillText(String(score), W / 2, 35);
      ctx.font = "bold 12px Arial"; outlined(T.points + pts, W / 2, 58, "#fff");
      var S = STAGES[stageAt(highestY)];
      ctx.fillStyle = "rgba(0,0,0,0.4)"; rr(10, 10, 96, 28, 10); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "bold 13px Arial"; ctx.textAlign = "center"; ctx.fillText(S.label + ": " + stageCount(stageAt(highestY)), 58, 29);
      drawMeter();
      if (!muted && !audioRunning() && nowS() - runStartedAt < 20) { ctx.font = "13px Arial"; ctx.textAlign = "center"; outlined("🔊 הקישי כדי להפעיל סאונד", W / 2, 62, "#fff"); }
      if (bannerUntil > nowS()) { ctx.globalAlpha = Math.min(1, (bannerUntil - nowS()) * 1.5); ctx.font = "bold 24px Arial"; if (ctx.measureText(bannerText).width > W - 30) ctx.font = "bold 20px Arial"; outlined(bannerText, W / 2, H * 0.22, "#fff"); ctx.globalAlpha = 1; }
      if (comboText && nowS() < comboUntil) { ctx.font = "bold 20px Arial"; outlined(comboText, W / 2, H * 0.32, "#ffd54f"); }
      if (nowS() - runStartedAt < 5) {
        ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.font = "16px Arial";
        ctx.textAlign = "left"; ctx.fillText("◀ החזיקי", 14, H - 24); ctx.textAlign = "right"; ctx.fillText("החזיקי ▶", W - 14, H - 24); ctx.textAlign = "center";
      }
    } else if (state === STATE_START) {
      ctx.fillStyle = "rgba(30,15,8,0.55)"; ctx.fillRect(0, 0, W, H);
      ctx.font = "bold 30px Arial"; outlined(T.title, W / 2, H * 0.30, "#fff");
      ctx.font = "16px Arial"; ctx.fillStyle = "#ffe9cf"; wrap(T.sub, W / 2, H * 0.40, W - 70, 24);
      ctx.font = "bold 20px Arial"; outlined(T.tap, W / 2, H * 0.68, "#ffd54f");
      if (!muted && !audioRunning()) { ctx.font = "15px Arial"; outlined("🔊 הקישי על המסך כדי להפעיל סאונד", W / 2, H * 0.68 + 32, "#ffffff"); }
      if (best > 0) { ctx.font = "15px Arial"; outlined(T.best + best, W / 2, H * 0.75, "#ffe9cf"); }
    } else {
      ctx.fillStyle = "rgba(30,15,8,0.68)"; ctx.fillRect(0, 0, W, H);
      var fy = H * 0.05, fs = 120;
      if (ready(FACE_SLEEP)) { ctx.drawImage(imgs[FACE_SLEEP], W / 2 - fs / 2, fy + 14, fs, fs); ctx.save(); ctx.translate(W / 2, fy + 14 + fs * 0.1); ctx.scale(2.6, 2.6); beanie(0, 0, 26); ctx.restore(); }
      ctx.textAlign = "center"; ctx.font = "bold 20px Arial"; outlined("z z z", W / 2 + 78, fy + 24, "#cfe3ff");
      var y = fy + fs + 52;
      ctx.font = "bold 28px Arial"; outlined(T.over, W / 2, y, "#fff"); y += 30;
      ctx.font = "19px Arial"; outlined(T.floors + score + "   |   " + T.points + pts, W / 2, y, "#ffe9cf"); y += 24;
      var nb = score >= best && score > 0;
      ctx.font = "15px Arial"; outlined((nb ? T.newBest : T.best + best) + "   |   " + T.chain + bestChain, W / 2, y, nb ? "#ffd54f" : "#ffe9cf"); y += 30;
      // everything collected, per item type
      ctx.font = "bold 16px Arial"; outlined(itemsGot > 0 ? T.collected : T.nothing, W / 2, y, "#fff"); y += 8;
      for (var ri2 = 0; ri2 < ITEM_ROWS.length; ri2++) {
        var kind = ITEM_ROWS[ri2][0], cnt = itemCounts[kind] || 0;
        if (!cnt) continue;
        y += 25;
        drawThing(kind, W / 2 + 84, y - 6, 20, 2);
        ctx.font = "16px Arial"; ctx.textAlign = "right"; outlined(ITEM_ROWS[ri2][1], W / 2 + 62, y, "#ffe9cf");
        ctx.textAlign = "left"; ctx.font = "bold 17px Arial"; outlined("x" + cnt, W / 2 - 80, y, "#ffd54f");
        ctx.textAlign = "center";
      }
      ctx.font = "bold 20px Arial"; outlined(T.again, W / 2, Math.max(y + 48, H * 0.80), "#ffd54f");
    }
  }

  function wrap(text, cx, y, maxW, lh) {
    var words = text.split(" "), line = "";
    for (var n = 0; n < words.length; n++) {
      var test = line ? line + " " + words[n] : words[n];
      if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, cx, y); line = words[n]; y += lh; } else line = test;
    }
    if (line) ctx.fillText(line, cx, y);
  }

  var lastT = 0;
  function loop(t) {
    requestAnimationFrame(loop);
    var now = t / 1000, dt = Math.min(0.033, now - (lastT || now)); lastT = now;
    if (state === STATE_PLAY) {
      if (!runStartedAt) runStartedAt = nowS();
      var rem = dt;
      while (rem > 0) { var h = Math.min(rem, 1 / 120); step(h); rem -= h; if (state !== STATE_PLAY) break; }
    }
    draw();
  }
  reset();
  requestAnimationFrame(loop);

  window.__game = {
    state: function () { return state; }, score: function () { return score; }, items: function () { return itemsGot; },
    start: advance, hold: function (s) { held[s]++; }, release: function (s) { if (held[s] > 0) held[s]--; },
    player: function () { return { x: player.x, y: player.y, vx: player.vx, vy: player.vy }; },
    audioTest: function () { audioInit(); if (!ac) return "noaudio"; sfx.jump(3); sfx.collect(); sfx.mega(); sfx.stage(); sfx.combo(3); sfx.over(); return ac.state; },
    offline: function (secs) { var AC = window.OfflineAudioContext; var oac = new AC(1, 44100 * secs, 44100); var sa = ac, sm = master, smg = musicGain, ssg = sfxGain, snb = noiseBuf, sn = nextStepT, si = stepIdx;
      ac = oac; setupGraph(); nextStepT = 0.05; stepIdx = 0; scheduleMusic(secs - 0.1); sfx.jump(0); sfx.collect(); sfx.mega(); sfx.over();
      return oac.startRendering().then(function (buf) { var d = buf.getChannelData(0), pk = 0, sq = 0, i; for (i = 0; i < d.length; i++) { var a = Math.abs(d[i]); if (a > pk) pk = a; sq += d[i] * d[i]; } 
        var half = [0,0]; for (i = 0; i < d.length; i++) half[i < d.length / 2 ? 0 : 1] += d[i] * d[i];
        ac = sa; master = sm; musicGain = smg; sfxGain = ssg; noiseBuf = snb; nextStepT = sn; stepIdx = si; return { peak: pk, rms: Math.sqrt(sq / d.length), h1: half[0], h2: half[1], samples: Array.prototype.slice.call(d.subarray(0, 44100 * 6)).filter(function (_, k) { return k % 11 === 0; }).length }; }); },
    over: function () { player.y = camY + H + 600; player.vy = 300; },
    info: function () { return { chain: chain, mult: mult, best: bestChain, pts: pts, score: score, items: itemsGot, state: state, x: player.x, y: player.y }; },
    fakeItems: function (a) { itemCounts = {}; for (var q = 0; q < ITEM_ROWS.length; q++) if (a[q]) itemCounts[ITEM_ROWS[q][0]] = a[q]; a = a.slice(); itemsGot = a.reduce(function (x, y) { return x + y; }, 0); pts = 1240; bestChain = 9; },
    fakeChain: function (n) { chain = n; mult = 1 + Math.min(4, Math.floor(n / 4)); lastLandAt = nowS() + 100; meterShown = Math.min(1, n / 16); },
    platformsList: function () { return platforms; },
    teleportFloors: function (f) { var dy = -f * 100 - player.y; player.y += dy; camY += dy; highestY = player.y; score = f; lastLandY = startY - f * 100;
      var first=null; for (var i = 0; i < 12; i++) { var last = platforms[platforms.length - 1]; var np = makePlatform(Math.min(last.y, player.y) - 80, false); platforms.push(np); if(!first){first=np;} } if(first){first.dog=true;first.item=null;first.x=100;first.w=140;first.y=player.y-90;}
      platforms.push({ x: 0, y: player.y + 60, w: W, h: 12, stage: stageAt(player.y), dog: false, item: null }); }
  };
})();
</script>
